<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Credere</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Georgia&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#f5f5f5] text-gray-900 font-sans antialiased h-screen flex items-center justify-center p-4">
    
    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] overflow-hidden flex flex-col md:flex-row">
        
        <div class="w-full md:w-1/2 p-10 md:p-14 flex flex-col justify-center">
            <div class="mb-10">
                <h1 class="text-3xl font-bold mb-2" style="font-family: 'Georgia', serif; color: #1a1a1a;">Credere</h1>
                <p class="text-gray-500 text-sm">Ingresá tus datos para acceder a tu panel.</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Correo electrónico</label>
                    <input type="email" id="email" required placeholder="ejemplo@correo.com" 
                           class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500 transition-colors bg-gray-50 focus:bg-white outline-none">
                </div>
                
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
                        <a href="#" class="text-xs text-yellow-600 hover:text-yellow-700 font-medium transition-colors">¿Olvidaste tu clave?</a>
                    </div>
                    <input type="password" id="password" required placeholder="••••••••" 
                           class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500 transition-colors bg-gray-50 focus:bg-white outline-none">
                </div>

                <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-medium py-3 rounded-lg shadow-sm transition-all transform active:scale-[0.98] mt-4">
                    Ingresar
                </button>
            </form>
        </div>

        <div class="hidden md:block w-1/2 bg-yellow-50 p-12 relative overflow-hidden">
            <div class="absolute inset-0 bg-yellow-400 opacity-10" style="background-image: radial-gradient(#ca8a04 1px, transparent 1px); background-size: 20px 20px;"></div>
            <div class="relative h-full flex flex-col justify-center items-start text-yellow-900 z-10">
                <h2 class="text-3xl font-bold mb-4" style="font-family: 'Georgia', serif;">Gestión ágil para tus préstamos</h2>
                <p class="text-yellow-800 text-lg leading-relaxed">Simplificá tu flujo de trabajo, administrá clientes y llevá el control de tus finanzas en un solo lugar.</p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            
            if (email) {
                localStorage.setItem('credere_session', email);
                window.location.href = 'index.html';
            }
        });

        if (localStorage.getItem('credere_session')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
